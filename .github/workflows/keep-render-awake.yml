name: Keep Render demo awake

on:
  schedule:
    - cron: '3/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Request tracker health endpoint
        run: |
          curl --fail \
                  --silent \
                  --show-error \
                  --location \
                  --connect-timeout 15 \
                  --max-time 90 \
                  --retry-max-time 300 \
                  --retry 2 \
                  --retry-delay 5 \
                  https://expense-tracker-kq6l.onrender.com/healthz/
