name: Keep Render demo awake

on:
  schedule:
    - cron: '3/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Request tracker health endpoint
        run: curl --fail \
                  --silent \
                  --show-error \
                  --location \
                  --max-time 120 \
                  --retry 2 \
                  --retry-delay 5 \
                  https://expense-tracker-kq6l.onrender.com/
