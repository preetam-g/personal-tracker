{% extends 'base.html' %}

{% block content %}
    <article style="max-width: 400px; margin: 2rem auto;">

        <header>
            <h2 style="margin-bottom: 0; font-size: 1.5rem;">Change your password</h2>
        </header>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <a href="{% url 'accounts:profile' %}"
                   role="button"
                   class="secondary outline"
                   style="flex: 1; text-align: center; margin-bottom: 0;"
                >Cancel</a>
                <button type="submit" style="flex: 1; margin-bottom: 0;">Update</button>
            </div>
        </form>

        <footer style="text-align: center;">
            <small>Forgot your old password? <a href="{% url 'accounts:password_reset' %}">Reset it here</a>.</small>
        </footer>

    </article>
{% endblock content %}
