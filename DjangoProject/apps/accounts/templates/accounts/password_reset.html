{% extends 'base.html' %}

{% block content %}
<article style="max-width: 400px; margin: 2rem auto;">
    <header>
        <h2 style="margin-bottom: 0;">Reset Password</h2>
    </header>

    <p style="color: var(--pico-muted-color);">
        Enter your email address, and we'll send you a secure link to set a new password.
    </p>

    <form method="POST">
        {% csrf_token %}
        
        {{ form.as_p }}
        
        <button type="submit" style="margin-top: 1rem; width: 100%;">Send Reset Link</button>
    </form>

    <footer style="text-align: center;">
        <small>
            {% if user.is_authenticated %}
                <a href="{% url 'accounts:profile' %}">&larr; Back to Profile</a>
            {% else %}
                <a href="{% url 'accounts:login' %}">&larr; Back to Login</a>
            {% endif %}
        </small>
    </footer>
</article>
{% endblock content %}
