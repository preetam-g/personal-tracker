<article>
        {% if expenses %}
            <figure style="max-height:  55vh; overflow-y: auto; margin: 0">
                <table role="grid" class="expense-tracker-table">
                    <thead>
                        <tr>
                            <th scope="col">Date</th>
                            <th scope="col">Category</th>
                            <th scope="col">Type</th>
                            <th scope="col">Amount</th>
                            <th scope="col">Modify</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for expense in expenses %}
                            <tr>
                                <td data-label="Date">{{ expense.date|date:"jS M'y" }}</td>
                                <td data-label="Category">{{ expense.category.name|default:"-" }}</td>
                                <td data-label="Type">{{ expense.type.name|default:"-" }}</td>
                                <td data-label="Amount"><strong>₹{{ expense.amount }}</strong></td>

                                <td data-label="Modify" style="display: flex; gap: 0.5rem; align-items: center;">
                                    <a href="{% url 'expenses:edit' expense.id %}" role="button" class="secondary outline" style="padding: 0.3rem 0.5rem; margin-bottom: 0; display: flex; align-items: center;" title="Edit">
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                        </svg>
                                    </a>

                                    <form action="{% url 'expenses:delete' expense.id %}" method="POST" style="display: inline; margin: 0;">
                                        {% csrf_token %}
                                        <button type="submit" class="outline" style="padding: 0.3rem 0.5rem; margin-bottom: 0; display: flex; align-items: center; color: #d9534f; border-color: #d9534f; background: transparent;" title="Delete">
                                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                                <polyline points="3 6 5 6 21 6"></polyline>
                                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                                <line x1="10" y1="11" x2="10" y2="17"></line>
                                                <line x1="14" y1="11" x2="14" y2="17"></line>
                                            </svg>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </figure>

        {% else %}
            <div style="text-align: center; padding: 3rem 1rem;">
                <h3 style="margin-bottom: 0.5rem;">No expenses yet!</h3>
                <p>Your wallet is looking suspiciously full.</p>
            </div>
        {% endif %}
    </article>
