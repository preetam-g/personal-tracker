databases:
  - name: personal-tracker-db
    plan: free
    region: singapore
    ipAllowList: []

services:
  - type: keyvalue
    name: personal-tracker-cache
    plan: free
    region: singapore
    ipAllowList: []

  - type: web
    name: personal-tracker
    runtime: python
    plan: free
    region: singapore
    rootDir: src
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.12"
      - key: IS_PRODUCTION
        value: "true"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: personal-tracker-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: personal-tracker-cache
          property: connectionString
      - key: EXCHANGE_RATE_BASE_URL
        value: https://v6.exchangerate-api.com/v6
      - key: EXCHANGE_RATE_API_KEY
        sync: false
