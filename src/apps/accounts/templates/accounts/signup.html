{% extends "base.html" %}

{% block content %}
    <article class="app-auth-card app-auth-card--wide">

        <header>
            <span class="app-page-eyebrow">Get started</span>
            <h1>Create an account</h1>
            <p>Your money and goals, all in one place.</p>
        </header>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Sign Up</button>
        </form>

        <footer>
            Already have an account?
            <a href="{% url "accounts:login" %}">Log In here</a>.
        </footer>

    </article>
{% endblock content %}
