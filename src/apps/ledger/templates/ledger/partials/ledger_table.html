<article>
    {% if transactions %}
        <figure class="app-table-wrapper">
            <table role="grid" class="app-table">
                <thead>
                <tr>
                    <th scope="col" style="width: 12%;">Date</th>
                    <th scope="col" style="width: 12%;">Contact</th>
                    <th scope="col" style="width: 12%;">Type</th>
                    <th scope="col" style="width: 18%;">Note</th>
                    <th scope="col" style="width: 15%;">Amount</th>
                    <th scope="col" style="width: 12%;">Modify</th>
                </tr>
                </thead>
                <tbody>
                {% for transaction in transactions %}
                    <tr>
                        <td data-label="Date">{{ transaction.date|date:"jS M'y" }}</td>
                        <td data-label="Contact">{{ transaction.contact.name|default:"-" }}</td>
                        <td data-label="Type">{{ transaction.get_type_display|default:"-" }}</td>
                        <td data-label="Note">{{ transaction.note|default:"-" }}</td>
                        <td data-label="Amount">
                            {% if transaction.signed_amount < 0 %}
                                <span class="amount-badge amount-badge--danger" title="Money Out">
                                    <svg
                                        width="14"
                                        height="14"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2.5"
                                        stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <line x1="5" y1="19" x2="19" y2="5"></line>
                                        <polyline points="5 5 19 5 19 19"></polyline>
                                    </svg>
                                    ₹{{ transaction.amount }}
                                </span>
                            {% else %}
                                <span class="amount-badge amount-badge--success" title="Money In">
                                    <svg
                                        width="14"
                                        height="14"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2.5"
                                        stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <line x1="19" y1="5" x2="5" y2="19"></line>
                                        <polyline points="19 19 5 19 5 5"></polyline>
                                    </svg>
                                    ₹{{ transaction.amount }}
                                </span>
                            {% endif %}
                        </td>
                        <td class="app-table-actions">
                            {% if transaction.is_settled %}
                                <span
                                    class="app-btn-icon"
                                    data-tippy-content="Settled transactions cannot be edited."
                                    aria-disabled="true"
                                    style="opacity: 0.5; cursor: default;"
                                >{% include "partials/icons/edit.html" %}</span>
                                <span
                                    class="app-btn-icon"
                                    data-tippy-content="Settled transactions cannot be deleted."
                                    aria-disabled="true"
                                    style="opacity: 0.5; cursor: default; color: #d9534f"
                                >{% include "partials/icons/delete.html" %}</span>
                            {% elif transaction.carry_forward_settlement %}
                                <span
                                    class="app-btn-icon"
                                    data-tippy-content="Carry-forward transactions cannot be edited."
                                    aria-disabled="true"
                                    style="opacity: 0.5; cursor: default;"
                                >{% include "partials/icons/edit.html" %}</span>
                                <span
                                    class="app-btn-icon"
                                    data-tippy-content="Carry-forward transactions cannot be deleted."
                                    aria-disabled="true"
                                    style="opacity: 0.5; cursor: default; color: #d9534f"
                                >{% include "partials/icons/delete.html" %}</span>
                            {% else %}
                                <a
                                    href="{% url 'ledger:edit' transaction.id %}?next={{ request.get_full_path|urlencode }}"
                                    class="app-btn-icon"
                                    data-tippy-content="Edit"
                                >{% include "partials/icons/edit.html" %}</a>
                                <button
                                    type="button"
                                    class="
                                        app-btn-icon
                                        app-btn-danger
                                        delete-btn
                                    "
                                    data-tippy-content="Delete"
                                    data-action="{% url 'ledger:delete' transaction.id %}?next={{ request.get_full_path|urlencode }}"
                                    data-message="
                                        Are you sure you want to delete this transaction for
                                        <strong>₹{{ transaction.amount }}</strong>?
                                        This action can't be reversed.
                                    "
                                >
                                    {% include "partials/icons/delete.html" %}
                                </button>
                            {% endif %}
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </figure>
    {% else %}

        <div class="app-empty-state">
            <h3 class="app-empty-title">No transactions yet!</h3>
            <p>You are perfectly balanced at zero. Yay!</p>
        </div>
    {% endif %}
</article>
