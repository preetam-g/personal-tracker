{% extends "generic_form.html" %}

{% block sub_header %}
    <p style="
        color: var(--pico-muted-color);
    ">Make sure to save the contact beforehand
        <a href="{% url 'base:add_contact' %}?next={{ request.get_full_path|urlencode }}">(Click Here)</a>
    </p>
{% endblock sub_header %}

{% block form_scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function() {

        const noteInput = document.getElementById('id_note');
        if (noteInput) {
            const maxLength = noteInput.getAttribute('maxlength');
            if (maxLength) {
                const counter = document.createElement('small');
                counter.style.display = 'block';
                counter.style.textAlign = 'right';
                counter.style.color = 'var(--pico-muted-color)';
                counter.style.marginTop = '-0.5rem';

                const updateCounter = () => {
                    const currentLength = noteInput.value.length;
                    counter.textContent = `${currentLength} / ${maxLength}`;
                    counter.style.color = currentLength >= maxLength ? 'var(--pico-form-element-invalid-active-border-color)' : 'var(--pico-muted-color)';
                };

                noteInput.parentNode.insertBefore(counter, noteInput.nextSibling);
                updateCounter(); // Run once on load
                noteInput.addEventListener('input', updateCounter);
            }
        }

    });
</script>
{% endblock form_scripts %}
