{% extends "base.html" %}


{% block content %}
<div style="margin-bottom: 1.5rem;">
    <a href="{% url 'ledger:home' %}" class="secondary" style="text-decoration: none;">
        &larr; Back
    </a>
</div>

<header class="app-page-head">
    <div><span class="app-page-eyebrow">Ledger history</span><h1>Transaction Activity</h1><p>Filter your transactions.</p></div>
</header>

<article>
    <form method="GET" action="{% url 'ledger:activity' %}" id="transaction-filter-form">
        <div class="app-filter-grid">
            {{form.as_div}}
        </div>
        <div class="app-filter-actions">
            <a href="{% url 'ledger:activity' %}"
               role="button"
               class="secondary outline"
               style="text-align: center;">Reset</a>
            <button type="submit">Apply</button>
        </div>
    </form>
</article>


{% include "ledger/partials/ledger_table.html" %}

{% endblock content %}
