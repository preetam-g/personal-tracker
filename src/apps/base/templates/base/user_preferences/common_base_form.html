{% extends "base.html" %}

{% block content %}
<article style="max-width: 600px; margin: 2rem auto;">

    <header>
        <h2 style="margin-bottom: 0;">
            {% if form.instance.pk %}
                Edit {% if title %}{{ title }}{% else %}Item{% endif %}
            {% else %}
                Add New {% if title %}{{ title }}{% else %}Item{% endif %}
            {% endif %}
        </h2>
    </header>

    <form method="POST" id="{{ form_id|default:'generic-form' }}">
        {% csrf_token %}
        {{ form.as_p }}
        <div style="display: flex; justify-content: flex-end; margin-top: 2rem;">
            <div style="display: flex; gap: 1rem;">
                <a href="{% url cancel_url_name %}" role="button" class="secondary outline" style="margin-bottom: 0;">Cancel</a>
                <button type="submit" style="margin-bottom: 0;">
                    {% if form.instance.pk %}Update{% else %}Save{% endif %}
                </button>
            </div>
        </div>
    </form>
</article>
{% endblock content %}
