
{% if progresses %}

    <article>
        <figure class="app-table-wrapper">
            <table role="grid" class="app-table">
                <thead>
                    <tr>
                        <th scope="col" style="width: 30%;">Plan</th>
                        <th scope="col" style="width: 20%">Date</th>
                        <th scope="col" style="width: 20%;">Completion</th>
                        <th scope="col" style="width: 5%;">Update</th>
                    </tr>
                </thead>

                <tbody>
                    {% for progress in progresses %}
                        <tr>
                            <td data-label="Plan">
                                {{ progress.plan }}
                            </td>
                            <td>
                                {{ progress.date }}
                            </td>
                            <td data-label="Progress">
                                {% include "habits/partials/progress_bar_with_progress.html" with obj=progress %}
                            </td>
                            <td data-label="Modify" class="app-table-actions">
                                {% if not progress.completed %}
                                    <form
                                        method="post"
                                        action="{% url 'habits:mark_progress_completed' progress.id %}?next={{ request.get_full_path|urlencode }}"
                                        style="display: inline;"
                                    >
                                        {% csrf_token %}
                                        <button
                                            type="submit"
                                            class="app-btn-icon"
                                            data-placement="left"
                                            data-tooltip="Mark completed"
                                            aria-label="Mark {{ progress }} as completed"
                                        >
                                            {% include "partials/icons/check_circle_icon.html" %}
                                        </button>
                                    </form>
                                {% else %}
                                    <span
                                        class="app-btn-icon"
                                        data-tooltip="Completed"
                                        data-placement="left"
                                        aria-label="Completed"
                                        aria-disabled="true"
                                        style="opacity: 0.5; cursor: default;"
                                    >
                                        {% include "partials/icons/check_circle_icon.html" %}
                                    </span>
                                {% endif %}
                                <a
                                    href="{% url 'habits:edit_daily_progress' progress.id %}?next={{ request.get_full_path|urlencode }}"
                                    class="app-btn-icon"
                                    data-tooltip="Edit"
                                    data-placement="right"
                                >
                                    {% include "partials/icons/edit_icon.html" %}
                                </a>
                            </td>
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </figure>
    </article>

{% else %}

    <article style="text-align: center;">
        <div style="margin-bottom: 1rem; color: var(--pico-muted-color);">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1"
                 stroke-linecap="round" stroke-linejoin="round"
            >
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
        </div>

        <p style="color: var(--pico-muted-color); margin-bottom: 1.5rem;">
            You don't have anything for today.
        </p>

        <a href="{% url 'habits:add_goal' %}?next={{ request.get_full_path|urlencode }}"
           role="button">
            + Add a goal for today
        </a>
    </article>

{% endif %}
