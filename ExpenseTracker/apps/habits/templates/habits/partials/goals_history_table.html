{% if goals %}

<article>
    <figure class="app-table-wrapper">
        <table role="grid" class="app-table">
            <thead>
                <tr>
                    <th scope="col" style="width: 25%;">Habit</th>
                    <th scope="col" style="width: 25%;">Target (per day)</th>
                    <th scope="col" style="width: 25%;">Duration</th>
                    <th scope="col" style="width: 15%;">Status</th>
                    <th scope="col" style="width: 10%;">Modify</th>
                </tr>
            </thead>

            <tbody>
                {% for goal in goals %}
                    <tr>
                        <td data-label="Habit">
                            <strong>{{ goal.habit.name }}</strong>
                        </td>
                        <td data-label="Target">
                            {{ goal.target_str }}
                        </td>
                        <td data-label="Duration">
                            {{ goal.start_date|date:"M j, Y" }}
                            &ndash;
                            {% if goal.end_date %}
                                {{ goal.end_date|date:"M j, Y" }}
                            {% else %}
                                Ongoing
                            {% endif %}
                        </td>
                        <td data-label="Status">
                             <span class="amount-badge {{ goal.status.badge_class }}">
                                {{ goal.status.label }}
                            </span>
                        </td>
                        <td class="app-table-actions">
                            <a
                                href="{% url "habits:detail_goal" goal.id %}"
                                class="app-btn-icon"
                                title="Manage Daily Progress"
                                data-tooltip="Plan History"
                                data-placement="left"
                            >
                                {% include 'partials/icons/calendar.html' %}
                            </a>
                            {% if goal.is_active %}
                                <a
                                    href="{% url 'habits:edit_goal' goal.id %}?next={{ request.get_full_path|urlencode }}"
                                    class="app-btn-icon"
                                    title="Edit Goal Details"
                                    data-tooltip="Edit"
                                    data-placement="right"
                                >
                                    {% include 'partials/icons/edit.html' %}
                                </a>
                            {% elif goal.is_ended %}
                                <form
                                    method="post"
                                    action="{% url "habits:end_goal" goal.id %}?next={{ request.get_full_path|urlencode }}"
                                    style="display: inline;"
                                >
                                    {%  csrf_token %}
                                    <button
                                        type="submit"
                                        class="app-btn-icon"
                                        data-tooltip="Restart Today"
                                        data-placement="right"
                                    >{% include "partials/icons/repeat.html" %}</button>
                                </form>
                            {% endif %}
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </figure>
</article>

{% else %}

 <article style="text-align: center;">
    <p style="margin-bottom: 0;">
        <strong>No goals yet</strong>
    </p>
    <p style="color: var(--pico-muted-color);">
        You don't have any active or past goals to track.
    </p>
    <a href="{% url 'habits:add_goal' %}?next={{ request.get_full_path|urlencode }}"
       role="button"
       class="secondary">
        🎯 Create your first goal
    </a>
</article>

{% endif %}
