<article>

    <header
        style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1% 2%;
        ">
        <strong>{{ title }}</strong>
        <a href="{{ add_url }}"
           role="button"
           class="btn-sm contrast outline"
           style="
               border: none;
               color: var(--pico-primary)
           "
        >+ Add</a>
    </header>

    {% for item in items %}

        <div
            style="
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin: 0.5rem 0;
            ">
            <span>{{ item.name }}</span>
            <span style="display: flex; gap: 0.5rem; align-items: center;">

                <!-- Edit -->
                <a href="{{ edit_url }}"
                   title="Edit"
                   style="
                       text-decoration: none;
                       display: flex;
                       align-items: center;
                   "
                >✏️</a>

                <!-- Delete -->
                <button
                    type="button"
                    class="delete-btn"
                    title="Delete"
                    data-action="{{ delete_url }}"
                    data-message="
                        Are you sure you want to delete
                        <strong>{{ item.name }}</strong>?
                        This action can't be reversed.
                    "
                    style="
                        padding: 0;
                        border: none;
                        background: transparent;
                        box-shadow: none;
                        margin: 0;
                        font-size: 1rem;
                        cursor: pointer;
                    ">🗑</button>
            </span>

        </div>

    {% empty %}

        <small>{{ empty_text }}</small>

    {% endfor %}

</article>
