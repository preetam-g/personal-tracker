<article>
    {% if transactions %}
        <figure class="app-table-wrapper">
            <table role="grid" class="app-table">
                <thead>
                <tr>
                    <th scope="col" style="width: 12%;">Date</th>
                    <th scope="col" style="width: 12%;">Contact</th>
                    <th scope="col" style="width: 12%;">Type</th>
                    <th scope="col" style="width: 18%;">Note</th>
                    <th scope="col" style="width: 15%;">Amount</th>
                    <th scope="col" style="width: 12%;">Modify</th>
                </tr>
                </thead>
                <tbody>
                {% for transaction in transactions %}
                    <tr>
                        <td data-label="Date">{{ transaction.date|date:"jS M'y" }}</td>
                        <td data-label="Contact">{{ transaction.contact.name|default:"-" }}</td>
                        <td data-label="Type">{{ transaction.get_type_display|default:"-" }}</td>
                        <td data-label="Note">{{ transaction.note|default:"-" }}</td>
                        <td data-label="Amount">
                            {% if transaction.signed_amount < 0 %}
                                <span class="amount-badge amount-badge--danger" title="Money Out">
                                    <svg
                                        width="14"
                                        height="14"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2.5"
                                        stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <line x1="5" y1="19" x2="19" y2="5"></line>
                                        <polyline points="5 5 19 5 19 19"></polyline>
                                    </svg>
                                    ₹{{ transaction.amount }}
                                </span>
                            {% else %}
                                <span class="amount-badge amount-badge--success" title="Money In">
                                    <svg
                                        width="14"
                                        height="14"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2.5"
                                        stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <line x1="19" y1="5" x2="5" y2="19"></line>
                                        <polyline points="19 19 5 19 5 5"></polyline>
                                    </svg>
                                    ₹{{ transaction.amount }}
                                </span>
                            {% endif %}
                        </td>

                        <td data-label="Modify" class="app-table-actions">
                            <!-- Edit -->
                            <a
                                href="{% url 'ledger:edit' transaction.id %}"
                                class="app-btn-icon"
                                title="Edit">
                                <svg
                                    width="18"
                                    height="18"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                </svg>
                            </a>

                            <!-- Delete -->
                            <button
                                type="button"
                                class="
                                    app-btn-icon
                                    app-btn-danger
                                    delete-btn
                                "
                                title="Delete"
                                data-action="{% url 'ledger:delete' transaction.id %}"
                                data-message="
                                    Are you sure you want to delete this transaction for
                                    <strong>₹{{ transaction.amount }}</strong>?
                                    This action can't be reversed.
                                ">
                                <svg
                                    width="18"
                                    height="18"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                    <line x1="10" y1="11" x2="10" y2="17"></line>
                                    <line x1="14" y1="11" x2="14" y2="17"></line>
                                </svg>
                            </button>
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </figure>
    {% else %}

        <div class="app-empty-state">
            <h3 class="app-empty-title">No transactions yet!</h3>
            <p>You are perfectly balanced at zero. Yay!</p>
        </div>
    {% endif %}
</article>
