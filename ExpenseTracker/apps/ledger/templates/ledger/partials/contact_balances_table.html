<article>
    {% if contacts_info %}
        <figure class="app-table-wrapper">
            <table role="grid" class="app-table app-table--ledger">
                <thead>
                <tr>
                    <th scope="col" style="width: 35%;">Contact</th>
                    <th scope="col" style="width: 20%;">Money Sent</th>
                    <th scope="col" style="width: 20%;">Money Received</th>
                    <th scope="col" style="width: 25%;">Balance</th>
                </tr>
                </thead>

                <tbody>
                {% for info in contacts_info %}
                    <tr>
                        <td data-label="Contact">
                            {{ info.contact_name }}
                        </td>

                        <td data-label="Money Sent">
                            ₹{{ info.sent|default:0|floatformat:2 }}
                        </td>

                        <td data-label="Money Received">
                            ₹{{ info.received|default:0|floatformat:2 }}
                        </td>

                        <td data-label="Balance">
                            {% if info.balance >= 0 %}
                                <strong>+₹{{ info.balance|floatformat:2 }}</strong>
                            {% else %}
                                <strong>-₹{{ info.balance|cut:"-"|floatformat:2 }}</strong>
                            {% endif %}
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </figure>

    {% else %}
        <div class="app-empty-state">
            <h3 class="app-empty-title">No contacts yet!</h3>
            <p>Add a few transactions to see a summary for each contact.</p>
        </div>
    {% endif %}
</article>
