<article>
    {% if expenses %}
        <figure class="app-table-wrapper">
            <table role="grid" class="app-table">
                <thead>
                <tr>
                    <th scope="col" style="width: 10%;">Date</th>
                    <th scope="col" style="width: 10%;">Category</th>
                    <th scope="col" style="width: 10%;">Type</th>
                    <th scope="col" style="width: 15%;">Note</th>
                    <th scope="col" style="width: 10%;">Amount</th>
                    <th scope="col" style="width: 10%;">Modify</th>
                </tr>
                </thead>
                <tbody>
                {% for expense in expenses %}
                    <tr>
                        <td data-label="Date">{{ expense.date|date:"jS M'y" }}</td>
                        <td data-label="Category">{{ expense.category.name|default:"-" }}</td>
                        <td data-label="Type">{{ expense.type.name|default:"-" }}</td>
                        <td data-label="Note">{{ expense.note|default:"-" }}</td>
                        <td data-label="Amount">
                            <strong>
                                {{ expense.formatted_amount_entered }}
                            </strong>
                            {% if expense.currency.code != 'INR' %}
                                <br/>
                                <small>{{ expense.formatted_amount }}</small>
                            {% endif %}
                        </td>
                        <td class="app-table-actions">
                            <a href="{% url 'expenses:edit' expense.id %}?next={{ request.get_full_path|urlencode }}"
                               class="app-btn-icon"
                               data-tippy-content="Edit"
                            >
                                {% include 'partials/icons/edit.html' %}
                            </a>
                            <button type="button"
                                class="
                                    app-btn-icon
                                    app-btn-danger
                                    delete-btn
                                "
                                data-tippy-content="Delete"
                                data-action="{% url 'expenses:delete' expense.id %}?next={{ request.get_full_path|urlencode }}"
                                data-message="
                                    Are you sure you want to delete this expense for
                                    <strong>{{ expense.formatted_amount_entered }}</strong>?
                                    This action can't be reversed.
                                ">
                                {% include "partials/icons/delete.html" %}
                            </button>
                        </td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </figure>
    {% else %}
        <div class="app-empty-state">
            <h3 class="app-empty-title">No expenses yet!</h3>
            <p>Your wallet is looking suspiciously full.</p>
        </div>
    {% endif %}
</article>
