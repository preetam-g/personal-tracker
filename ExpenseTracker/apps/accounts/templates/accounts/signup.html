{% extends "base.html" %}

{% block content %}
    <article style="max-width: 600px; margin: 0 auto;">

        <header>
            <h2 style="margin-bottom: 0;">Create an Account</h2>
        </header>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Sign Up</button>
        </form>

        <footer>
            Already have an account?
            <a href="{% url "accounts:login" %}">Log In here</a>.
        </footer>

    </article>
{% endblock content %}
