{% extends 'base.html' %}

{% block content %}
<article style="max-width: 400px; margin: 2rem auto;">
    
    {% if validlink %}
        <header>
            <h2 style="margin-bottom: 0;">Set New Password</h2>
        </header>
        
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="margin-top: 1rem; width: 100%;">Save Password</button>
        </form>
        
    {% else %}
        <header>
            <h2 style="margin-bottom: 0; color: #d9534f;">Invalid Link</h2>
        </header>
        
        <p>This password reset link is invalid, possibly because it has already been used or expired.</p>
        
        <div style="margin-top: 2rem;">
            <a href="{% url 'accounts:password_reset' %}" role="button" style="width: 100%;">
                Request a new link
            </a>
        </div>
    {% endif %}

</article>
{% endblock content %}
