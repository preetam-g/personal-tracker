{% extends "base.html" %}

{% block content %}
<article style="max-width: 600px; margin: 2rem auto;">

    <header>
        <h2 style="margin-bottom: 0;">
            {% if form.instance.pk %}
                Edit
            {% else %}
                Add New
            {% endif %}
            {{ item_name|default:"Item" }}
        </h2>
    </header>

    <form method="POST" id="{{ form_id|default:'generic-form' }}">
        {% csrf_token %}

        {{ form.as_p }}

        <div style="display: flex; justify-content: flex-end; margin-top: 2rem;">
            <div style="display: flex; gap: 1rem;">
                <a href="{{ request.GET.next }}"
                   role="button" class="secondary outline" style="margin-bottom: 0;">Cancel</a>
                <button type="submit" style="margin-bottom: 0;">
                    {% if form.instance.pk %}Update{% else %}Save{% endif %}
                </button>
            </div>
        </div>
    </form>
</article>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById(
            "{{ form_id|default:'generic-form' }}"
        );

        if (!form) return;

        form.querySelectorAll("textarea[maxlength]").forEach((field) => {
            const maxLength = field.maxLength;

            const counter = document.createElement("small");
            counter.style.display = "block";
            counter.style.textAlign = "right";
            counter.style.color = "var(--pico-muted-color)";
            counter.style.marginTop = "-0.5rem";

            const updateCounter = () => {
                const currentLength = field.value.length;

                counter.textContent = `${currentLength} / ${maxLength}`;
                counter.style.color =
                    currentLength >= maxLength
                        ? "var(--pico-form-element-invalid-active-border-color)"
                        : "var(--pico-muted-color)";
            };

            field.insertAdjacentElement("afterend", counter);

            updateCounter();
            field.addEventListener("input", updateCounter);
        });
    });
</script>
{% endblock content %}
